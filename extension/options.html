<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Capture Options</title>
    <script defer src="js/core.js"></script>
    <script defer src="js/options.js"></script>
    <style>
      @font-face { font-family: Inter; font-style: normal; font-weight: 100 900; font-display: swap; src: url("font/InterVariable.woff2") format("woff2"); }
      :root { color-scheme: light dark; --bg:#fff; --fg:#242424; --muted:#666; --border:#e5e5e5; --brand:#0d99ff; --alert:#fff5d6; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--fg); font:14px/1.5 Inter,system-ui,sans-serif; }
      main { width:min(100%,400px); padding:32px 24px; border:1px solid var(--border); border-radius:8px; text-align:center; box-shadow:0 2px 5px #0000000d,0 10px 24px #0000000a; }
      h1 { margin:0; font-size:20px; line-height:1.35; font-weight:600; }
      p { margin:16px 0; color:var(--muted); }
      .icon { display:block; width:56px; height:56px; margin:0 auto 20px; }
      .pill { display:flex; align-items:center; justify-content:space-between; gap:16px; margin:24px 0; padding:12px 16px; border:1px solid var(--border); border-radius:8px; text-align:left; }
      .toggle { flex-shrink:0; width:28px; height:16px; border-radius:20px; background:var(--brand); position:relative; }
      .toggle::after { content:""; position:absolute; width:12px; height:12px; top:2px; right:2px; background:#fff; border-radius:50%; }
      ul { padding:0; margin:24px 0; list-style:none; text-align:left; }
      li { display:flex; gap:8px; margin:12px 0; }
      li img { width:14px; height:14px; margin-top:3px; }
      button { width:100%; min-height:40px; margin-top:10px; padding:8px 16px; border:1px solid transparent; border-radius:6px; background:var(--brand); color:#fff; font:inherit; font-weight:550; cursor:pointer; }
      button.secondary { background:var(--bg); color:var(--fg); border-color:var(--border); }
      button:disabled { opacity:.55; cursor:wait; }
      button:focus-visible { outline:3px solid var(--brand); outline-offset:3px; }
      .notice { margin:16px 0; padding:12px; border-radius:6px; background:var(--alert); text-align:left; }
      .loading { color:var(--muted); box-shadow:none; }
      @media (prefers-color-scheme:dark) { :root { --bg:#252525; --fg:#f3f3f3; --muted:#bbb; --border:#444; --alert:#493c16; } }
    </style>
  </head>
  <body>
    <main id="settings" aria-live="polite"></main>
  </body>
</html>
