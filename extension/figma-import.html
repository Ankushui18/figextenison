<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Import a Figma copy</title>
    <script defer src="js/figma-clip.js"></script>
    <script defer src="js/figma-import.js"></script>
    <style>
      @font-face { font-family: Inter; font-style: normal; font-weight: 100 900; font-display: swap; src: url("font/InterVariable.woff2") format("woff2"); }
      :root { color-scheme: light dark; --bg:#fff; --fg:#242424; --muted:#666; --border:#e5e5e5; --brand:#0d99ff; --alert:#fff5d6; --ok:#e7f6ec; --ok-fg:#146c2e; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--fg); font:14px/1.5 Inter,system-ui,sans-serif; }
      main { width:min(100%,640px); padding:28px; border:1px solid var(--border); border-radius:8px; box-shadow:0 2px 5px #0000000d,0 10px 24px #0000000a; }
      h1 { margin:0 0 8px; font-size:19px; font-weight:600; }
      h2 { margin:0; font-size:15px; font-weight:600; }
      p { margin:10px 0; color:var(--muted); }
      ol { margin:12px 0 18px; padding-left:20px; color:var(--muted); }
      li { margin:6px 0; }
      code, kbd { font:12px ui-monospace,SFMono-Regular,Consolas,monospace; border:1px solid var(--border); border-radius:4px; padding:1px 5px; }
      button { min-height:38px; padding:8px 16px; border:1px solid transparent; border-radius:6px; background:var(--brand); color:#fff; font:inherit; font-weight:550; cursor:pointer; }
      button.secondary { background:var(--bg); color:var(--fg); border-color:var(--border); }
      button.small { min-height:30px; padding:4px 10px; font-size:13px; }
      button:disabled { opacity:.55; cursor:wait; }
      button:focus-visible { outline:3px solid var(--brand); outline-offset:2px; }
      .notice { margin:14px 0; padding:10px 12px; border-radius:6px; background:var(--alert); }
      .notice[role="status"] { background:var(--ok); color:var(--ok-fg); }
      .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
      .list { margin-top:22px; border-top:1px solid var(--border); }
      .row { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); }
      .row .meta { flex:1; min-width:0; }
      .row .meta strong { display:block; font-weight:600; }
      .row .meta span { color:var(--muted); font-size:12px; }
      .row .row-actions { display:flex; gap:6px; flex-shrink:0; }
      .empty { color:var(--muted); padding:14px 0 0; }
      .foot { margin-top:18px; font-size:12px; }
      @media (prefers-color-scheme:dark) { :root { --bg:#252525; --fg:#f3f3f3; --muted:#bbb; --border:#444; --alert:#493c16; --ok:#14351f; --ok-fg:#9fe0b3; } }
    </style>
  </head>
  <body>
    <main id="import" aria-live="polite"></main>
  </body>
</html>
