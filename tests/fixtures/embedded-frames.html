<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Embedded frames fixture</title>
<style>
  body { margin: 0; padding: 24px; font: 14px/1.4 Arial, sans-serif; background: #f5f4ef; }
  h1 { margin: 0 0 16px; }
  iframe { display: block; border: 0; background: #fff; margin: 0 0 16px; }
</style></head>
<body>
  <h1 id="outer">Embedded frames fixture</h1>
  <iframe id="srcdoc-frame" title="Card A" width="390" height="300" style="width:390px;height:300px;border-radius:24px"
    srcdoc="&lt;!DOCTYPE html&gt;&lt;html&gt;&lt;body style='margin:0;background:#faf9f5;font-family:Arial'&gt;&lt;div style='padding:20px'&gt;&lt;h2&gt;Inner card A&lt;/h2&gt;&lt;p&gt;Srcdoc frame content&lt;/p&gt;&lt;/div&gt;&lt;/body&gt;&lt;/html&gt;"></iframe>
  <iframe id="same-origin-frame" title="Card B" src="/inner" width="390" height="300" style="width:390px;height:300px;border-radius:24px"></iframe>
  <iframe id="cross-origin-frame" title="Other origin" src="__CROSS_ORIGIN__" width="390" height="120" style="width:390px;height:120px"></iframe>
</body></html>
