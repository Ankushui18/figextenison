<!doctype html><html><head><meta charset="utf-8"><title>Internal scroll-area regression</title><link rel="icon" href="data:,"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font:16px/24px Arial,sans-serif;color:#222}#app{width:100vw;height:100vh;overflow:auto;background:#f6f7f8}.app-header{height:64px;padding:20px;background:#2c2c2c;color:#fff}.entry{height:280px;margin:0 24px;padding:24px;border-bottom:1px solid #ccc;background:#fff}.end{height:214px;padding:40px;background:#dceeff}
</style></head><body><main id="app"><header class="app-header">Dashboard header</header><section id="feed" aria-label="Primary feed"></section></main><script>
for(let i=1;i<=8;i++){const card=document.createElement('article');card.className='entry';card.id='entry-'+i;card.textContent='Scrollable section '+i;document.querySelector('#feed').append(card)}
const footer=document.createElement('footer');footer.id='internal-end';footer.className='end';footer.textContent='Final content at the bottom of the internal scroll area';document.querySelector('#feed').append(footer);
</script></body></html>
